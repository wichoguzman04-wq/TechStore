<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>TechShop | Inventario de Productos</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/bootstrap/css/sticky-footer-navbar.css}" rel="stylesheet">
    <style>
        body { padding-top: 5.5rem; }
        .container-fluid { padding-left: 5%; padding-right: 5%; }
        .table thead th { vertical-align: middle; text-transform: uppercase; font-size: 0.9rem; padding: 15px; }
        .prod-img { object-fit: cover; border: 1px solid #dee2e6; }
        .btn-detail { background-color: #007bff; border-color: #007bff; color: white; padding: 0.5rem 1rem; margin-right: 8px; }
        .btn-detail:hover { background-color: #0069d9; color: white; }
        .btn-delete { background-color: #dc3545; border-color: #dc3545; color: white; padding: 0.5rem 1rem; }
        .btn-delete:hover { background-color: #c82333; color: white; }
        .badge-yes { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; padding: 0.6em 1em; font-weight: bold; }
        .badge-no { background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; padding: 0.6em 1em; font-weight: bold; }
        .td-actions { min-width: 220px; }
        .price-text { font-weight: 600; color: #333; font-size: 1.1rem; }
    </style>
</head>
<body class="bg-light">

    <header th:insert="~{fragments/menu :: menu-principal}"></header>

    <div class="container-fluid mt-4">
        <div class="d-flex align-items-center mb-4">
            <h1 class="h2 mb-0 text-dark font-weight-bold">Inventario TechShop</h1>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-dark text-white">
                            <tr>
                                <th class="ps-4">Vista</th>
                                <th>ID</th>
                                <th>Producto</th>
                                <th>Publicación</th>
                                <th>Precio</th>
                                <th style="width: 30%;">Descripción</th>
                                <th class="text-center">Destacado</th>
                                <th class="text-center pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="prod : ${productos}">
                                <td class="ps-4">
                                    <img th:src="@{/images/{img}(img=${prod?.imagen != null && prod?.imagen != '' ? prod.imagen : 'no-image.png'})}"
                                         width="75" height="75" class="rounded prod-img shadow-sm" />
                                </td>
                                <td class="font-weight-bold" th:text="${prod?.id}"></td>
                                <td class="font-weight-bold" th:text="${prod?.nombre}"></td>
                                
                                <td class="text-muted" th:text="${prod?.fecha != null ? #dates.format(prod.fecha, 'dd-MM-yyyy') : 'Sin fecha'}"></td>
                                
                                <td><span class="price-text" th:text="${'$' + prod?.precio}"></span></td>
                                
                                <td class="text-muted small" th:text="${prod?.detalle}"></td>
                                
                                <td class="text-center">
                                    <span th:if="${prod?.destacado == 1}" class="badge badge-yes">SÍ</span>
                                    <span th:unless="${prod?.destacado == 1}" class="badge badge-no">NO</span>
                                </td>
                                <td class="text-center pe-4 td-actions">
                                    <div class="d-flex justify-content-center">
                                        <a th:href="@{/productos/view/{id}(id=${prod?.id})}" class="btn btn-detail shadow-sm"> Detalle </a>
                                        <a th:href="@{/productos/delete/{id}(id=${prod?.id})}" class="btn btn-delete shadow-sm"> Eliminar </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer th:insert="~{fragments/footer :: pie-pagina}"></footer>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
