<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>TechStore | Gestión de Productos</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="container mt-5">

    <div class="card">
        <h2 class="card-header d-flex justify-content-between align-items-center">
            Inventario de Productos
            <a th:href="@{/productos/create}" class="btn btn-primary btn-sm">Nuevo Producto</a>
        </h2>
        
        <div class="card-body">
            
            <div th:if="${msg != null}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${msg}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <table class="table table-striped table-hover mt-3">
                <thead class="thead-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">IMAGEN</th>
                        <th scope="col">NOMBRE</th>
                        <th scope="col">FECHA</th>
                        <th scope="col">PRECIO</th>
                        <th scope="col">DESTACADO</th>
                        <th scope="col">¿ACTIVO?</th>
                        <th scope="col" class="text-center">ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prod : ${productos}">
                        <td th:text="${prod?.id}"></td>
                        
                        <td>
                            <img th:src="@{/images/{img} (img=${prod?.imagen != null && prod?.imagen != '' ? prod.imagen : 'no-image.png'})}" 
                                 class="rounded" 
                                 style="max-width: 50px; height: auto;" 
                                 alt="Imagen Producto">
                        </td>
                        
                        <td th:text="${prod?.nombre}"></td>
                        
                        <td th:text="${prod?.fecha != null ? #dates.format(prod.fecha, 'dd-MM-yyyy') : 'Sin fecha'}"></td>
                        
                        <td th:text="${'$' + prod?.precio}"></td>
                        
                        <td>
                            <span th:if="${prod?.destacado == 1}" class="badge badge-success">SÍ</span>
                            <span th:if="${prod?.destacado != 1}" class="badge badge-danger">NO</span>
                        </td>
                        
                        <td>
                            <span th:if="${prod?.activo}" class="badge badge-success">Sí</span>
                            <span th:if="${!prod?.activo}" class="badge badge-danger">No</span>
                        </td>
                        
                        <td class="text-center">
                            <a th:href="@{/productos/view/{id} (id=${prod?.id})}" class="btn btn-success btn-sm">Detalle</a>
                            <a th:href="@{/productos/delete (id=${prod?.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>/html>
