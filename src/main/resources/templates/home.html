<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>TechStore | Tu Tienda de Tecnología</title>
    
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/bootstrap/css/jumbotron.css}" rel="stylesheet">
    <link th:href="@{/bootstrap/css/sticky-footer-navbar.css}" rel="stylesheet">
    
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; padding-top: 5.5rem; }
        main { flex: 1 0 auto; }
        footer { flex-shrink: 0; width: 100% !important; }
    </style>
</head>

<body>

    <header th:insert="~{fragments/menu :: menu-principal}"></header>

    <main role="main">

        <div class="jumbotron">
            <div class="container">
                <h3 class="mt-5">Encuentra los mejores productos tecnológicos.</h3>
                Puedes buscar por descripción y categoría.
                <form class="form-inline">
                    <input type="text" class="form-control mb-3" placeholder="Escriba una búsqueda">&nbsp;
                    <select class="custom-select custom-select mb-3">
                        <option selected>Seleccione una categoría</option>
                        <option value="1">Laptops</option>
                        <option value="2">Periféricos</option>
                        <option value="3">Componentes</option>
                        <option value="4">Monitores</option>
                    </select>&nbsp;
                    <button type="submit" class="btn btn-primary mb-3">Buscar</button>
                </form>
            </div>
        </div>
        <hr>

        <div class="container">
            <h2 class="font-weight-bold text-center text-capitalize">DESTACADOS</h2>
            <hr>

            <div class="row" th:each="prod : ${productos}">
                <div class="col-md-3">
                    <img class="rounded mx-auto d-block"
                        th:src="@{/images/{img} (img=${prod?.imagen != null && prod?.imagen != '' ? prod.imagen : 'no-image.png'})}"
                        alt="Imagen del producto" width="220" height="220">
                </div>
                <div class="col-md-9">
                    <h2 th:text="${prod?.nombre}">Nombre del Producto</h2>

                    <h6 class="card-title">
                        <strong>Categoría: </strong> <span>Tecnología</span>
                    </h6>

                    <h6 class="card-title">
                        <strong>Publicado: </strong> <span
                            th:text="${prod?.fecha != null ? #dates.format(prod.fecha, 'dd-MM-yyyy') : 'Sin fecha'}">01-01-2026</span>
                    </h6>

                    <p th:text="${prod?.descripcion}">Descripción detallada del producto...</p>

                    <p>
                        <a th:href="@{/detalle/{id}(id=${prod?.id})}" class="btn btn-primary">
                            Ver detalles >>
                        </a>
                    </p>
                </div>
                <hr class="col-12">
            </div>
        </div>
    </main>

    <footer th:insert="~{fragments/footer :: pie-pagina}"></footer>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
