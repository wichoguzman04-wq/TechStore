<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>TechStore | Gestión de Categorías</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="container mt-5">

    <div class="card">
        <h2 class="card-header d-flex justify-content-between align-items-center">
            Categorías de Productos
            <a th:href="@{/categorias/create}" class="btn btn-primary btn-sm">Nueva Categoría</a>
        </h2>
        
        <div class="card-body">
            
            <table class="table table-striped table-hover mt-3">
                <thead class="thead-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">NOMBRE</th>
                        <th scope="col">DESCRIPCIÓN</th>
                        <th scope="col">¿ACTIVA?</th>
                        <th scope="col" class="text-center">ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${categorias}">
                        <td th:text="${cat?.id}"></td>
                        <td th:text="${cat?.nomCategoria}"></td>
                        <td th:text="${cat?.descripcion}"></td>
                        <td>
                            <span th:if="${cat?.activo}" class="badge badge-success">Sí</span>
                            <span th:if="${!cat?.activo}" class="badge badge-danger">No</span>
                        </td>
                        <td class="text-center">
                            <a href="#" class="btn btn-warning btn-sm">Editar</a>
                            <a href="#" class="btn btn-danger btn-sm">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <a th:href="@{/}" class="btn btn-secondary">Volver al Inicio</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
