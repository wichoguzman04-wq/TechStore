<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head> 
    <meta charset="UTF-8">
    <title>TechStore | Gestión de Categorías</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Poppins', sans-serif; padding-top: 5.5rem; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
        .table { color: #cbd5e1; }
        .table thead th { background-color: #0f172a; color: #94a3b8; border-bottom: 2px solid #334155; }
        .table tbody td { border-top: 1px solid #334155; }
        .btn-delete { background-color: #e11d48; color: white; }
    </style>
</head>
<body>
    <header th:insert="~{fragments/menu :: menu-principal}"></header>

    <main role="main">
        <div class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 style="color: #38bdf8;">Gestión de Categorías</h2>
                <a th:href="@{/categorias/create}" class="btn btn-success"><i class="fas fa-plus"></i> Nueva Categoría</a>
            </div>

            <div class="card">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat : ${categorias}">
                            <td th:text="${cat.id}"></td>
                            <td th:text="${cat.nomCategoria}"></td>
                            <td th:text="${cat.descripcion}"></td>
                            <td class="text-center">
                                <a th:href="@{/categorias/delete(id=${cat.id})}" class="btn btn-sm btn-delete" onclick="return confirm('¿Seguro?')"><i class="fas fa-trash-alt"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
