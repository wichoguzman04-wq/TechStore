<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>TechShop | Nuevo Producto</title>

<link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
<link th:href="@{/bootstrap/css/jumbotron.css}" rel="stylesheet">
<link th:href="@{/bootstrap/css/sticky-footer-navbar.css}" rel="stylesheet">
<link href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css" rel="stylesheet">
</head>

<body>

	<header th:insert="~{fragments/menu :: menu-principal}"></header>

	<main role="main">
		<hr>
		<div class="container" style="padding-top: 4.5rem;">

			<div class="card">
				<h4 class="card-header"><strong>Datos del Producto</strong></h4>
				<div class="card-body">
					<form th:action="@{/productos/save}" th:object="${techStore}" method="post">

						<div th:if="${#fields.hasErrors('*')}" class='alert alert-danger' role='alert'>
							Por favor corrija los siguientes errores:
							<ul>
								<li th:each="err : ${#fields.errors('*')}" th:text="${err}" />
							</ul>
						</div>

						<div class="row">
							<div class="col-md-3">
								<div class="form-group">
									<label for="nombre">Nombre</label> 
									<input type="text" class="form-control" th:field="*{nombre}" id="nombre" placeholder="Ej. Laptop Gamer" required="required">
								</div>
							</div>
							<div class="col-md-9">
								<div class="form-group">
									<label for="descripcion">Descripción</label> 
									<input type="text" class="form-control" th:field="*{descripcion}" id="descripcion" placeholder="Breve descripción del producto" required="required">
								</div>
							</div>
						</div>

						<div class="row">
							<div class="col-md-3">
								<div class="form-group">
									<label for="categoria">Categoría</label> 
									<select class="form-control" th:field="*{categoria.id}" id="categoria" required="required">
										<option value="">Seleccione una categoría</option>
										<option th:each="cat : ${categorias}" 
												th:value="${cat.id}" 
												th:text="${cat.nomCategoria}"></option>
									</select>
								</div>
							</div>

							<div class="col-md-3">
								<div class="form-group">
									<label for="fecha">Fecha de Publicación</label> 
									<input type="text" class="form-control" th:field="*{fecha}" id="fecha" placeholder="dd-mm-aaaa" required="required">
								</div>
							</div>

							<div class="col-md-3">
								<div class="form-check">
									<label><strong>Destacado</strong></label><br>
									<input class="form-check-input" type="radio" th:field="*{destacado}" id="destacado1" value="1"> 
									<label class="form-check-label" for="destacado1">Sí</label>
								</div>
								<div class="form-check">
									<input class="form-check-input" type="radio" th:field="*{destacado}" id="destacado0" value="0"> 
									<label class="form-check-label" for="destacado0">No</label>
								</div>
							</div>
						</div>

						<div class="row">
							<div class="col-md-3">
								<div class="form-group">
									<label for="precio">Precio</label> 
									<input type="number" step="0.01" class="form-control" th:field="*{precio}" id="precio" placeholder="0.00" required="required">
								</div>
							</div>
							<div class="col-md-3">
								<div class="form-group">
									<label for="archivoImagen">Imagen</label> 
									<input type="file" class="form-control-file" id="archivoImagen">
								</div>
							</div>
						</div>

						<hr>
						<div class="row">
							<div class="col-md-9">
								<div class="form-group">
									<label for="detalle"><strong>Detalles</strong></label>
									<textarea class="form-control" th:field="*{detalle}" id="detalle" rows="7"></textarea>
								</div>
							</div>
							<div class="col-md-3">
								<label>Vista previa</label> 
								<img class="rounded mx-auto d-block" th:src="@{/images/no-image.png}" alt="Producto" width="200" height="200">
							</div>
						</div>

						<hr>
						<button type="submit" class="btn btn-primary">Guardar</button>
						<a th:href="@{/productos/index}" class="btn btn-secondary">Cancelar</a>
					</form>
				</div>
			</div>
		</div>
	</main>

	<footer th:insert="~{fragments/footer :: pie-pagina}"></footer>

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
	<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
	<script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
	<script>
      $(function () {
          $("#fecha").datepicker({dateFormat: 'dd-mm-yy'});
      });
    </script>
</body>
</html>
